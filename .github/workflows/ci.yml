name: CI

on:
  push:
    branches: [gh-pages]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (grammy)
        run: npm ci

      - name: Lint (syntax check every shipped file)
        run: npm run lint

      - name: Test (unit + Docker E2E + gateway + Nostr)
        run: npm test
